.combine-page .content{display:flex;flex-direction:column}
.combine-page{--combine-accent:#2563eb;--combine-soft:#eff6ff;--combine-line:#bfdbfe}
.combine-page.combine-sequence{--combine-accent:#ea580c;--combine-soft:#fff7ed;--combine-line:#fed7aa}
.combine-layout{flex:1;min-height:0;display:grid;grid-template-columns:1.08fr 1fr;gap:24px}
.combine-demo,.combine-practice{min-height:0;display:flex;flex-direction:column;padding:22px 26px}
.combine-card-head{display:flex;align-items:center;gap:12px;padding-bottom:10px;border-bottom:1px solid #e7e5e4;margin-bottom:12px}
.combine-card-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--combine-soft);color:var(--combine-accent);font-size:22px;flex-shrink:0}
.combine-card-head h3{font-size:25px;line-height:1.4}
.combine-card-head small{font-size:14px;color:#78716c;margin-left:auto}
.combine-block{padding:10px 16px;border-radius:14px;background:#fafaf9;border:1px solid #e7e5e4}
.combine-label{font-size:15px;font-weight:900;display:flex;align-items:center;gap:9px;color:#57534e;margin:0 0 7px}
.combine-label span{display:grid;place-items:center;width:24px;height:24px;border-radius:8px;background:#e7e5e4;font-family:'M PLUS Rounded 1c',sans-serif;font-size:14px}
.combine-block p{font-size:23px;line-height:1.45}
.combine-original p+p{margin-top:1px}
.combine-key{color:var(--combine-accent);font-weight:900;background:var(--combine-soft);border-radius:4px;padding:0 3px}
.combine-method{margin:10px 0;background:var(--combine-soft);border:0;border-left:6px solid var(--combine-accent);padding:11px 15px}
.combine-method .combine-label,.combine-result .combine-label{color:var(--combine-accent)}
.combine-method .combine-label span,.combine-result .combine-label span{background:var(--combine-accent);color:#fff}
.combine-method p{font-size:19px;line-height:1.5}
.combine-result{border:2px solid var(--combine-line);background:#fff;flex:1;display:flex;flex-direction:column;justify-content:center}
.combine-result p{font-size:24px;font-weight:700;line-height:1.5}
.combine-practice{border:3px dashed #fde047;padding:19px 23px}
.combine-practice .combine-card-icon{background:#fef9c3;color:#a16207}
.combine-practice-original{background:#fffbeb;border:0;padding:19px 20px}
.combine-practice-original p{font-size:25px;line-height:1.85}
.combine-cue{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:18px;color:#57534e}
.combine-cue b{padding:5px 14px;border:2px solid var(--combine-line);border-radius:10px;background:var(--combine-soft);color:var(--combine-accent);font-size:22px}
.combine-paper{margin-top:auto;padding-top:12px}
.combine-paper-title{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:700;color:#9a3412;margin-bottom:4px}
.combine-paper .paper-line{height:25px;margin:0;border-bottom:2px solid #e7e5e4}
.combine-paper-note{font-size:15px;color:#78716c;line-height:1.6;margin-top:10px}
/* 看圖寫句：各圖搭配詞語提示，學生自行組句。 */
.figure-page .content{display:flex;flex-direction:column}
.figure-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:19px}
.figure-card{min-height:0;display:flex;flex-direction:column;padding:14px 16px 20px}
.figure-card svg{width:100%;height:225px;flex-shrink:0;display:block;border-radius:15px;background:#fafaf9}
.figure-card h3{font-size:17px;line-height:1.5;margin:11px 0;color:var(--orange)}
.figure-vocab-label{font-size:14px;line-height:1.5;color:#78716c;margin-bottom:7px}
.figure-vocab-list{display:flex;flex-wrap:wrap;gap:8px}
.figure-vocab-list span{font-size:19px;line-height:1.4;font-weight:700;color:#9a3412;background:#fff7ed;border:1px solid #fed7aa;border-radius:9px;padding:4px 12px}
.figure-answer{margin-top:auto;padding-top:8px}
.figure-card .paper-line{height:29px;margin:4px 0 0}
/* 寫作準備與正式寫作分頁，維持紙上作答。 */
.writing-page .content{display:flex;flex-direction:column}
.plan-layout{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
.plan-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:1fr 1fr;gap:18px}
.plan-card{grid-column:span 2;display:flex;flex-direction:column;padding:20px 24px}
.plan-card.wide{grid-column:span 3}
.plan-card-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.plan-number{width:34px;height:34px;border-radius:11px;background:#ffedd5;color:#c2410c;display:grid;place-items:center;font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;font-size:19px;flex-shrink:0}
.plan-card h3{font-size:25px}
.plan-card p{font-size:18px;line-height:1.65;color:#57534e}
.plan-card .paper-line{height:29px;margin: auto 0 0;border-bottom:2px solid #d6d3d1}
.plan-card:nth-child(2n) .plan-number{background:#dbeafe;color:#1d4ed8}
.plan-reminder{display:flex;align-items:center;gap:12px;background:#ffedd5;color:#9a3412;border-radius:14px;padding:13px 20px;font-size:18px;line-height:1.5}
.writing-assignment{flex:1;min-height:0;border-left:12px solid var(--orange);padding:20px 28px;display:flex;flex-direction:column}
.assignment-heading{display:flex;align-items:center;gap:25px;padding-bottom:15px;border-bottom:1px solid #e7e5e4}
.assignment-heading h3{font-family:'M PLUS Rounded 1c',sans-serif;font-size:34px;color:#9a3412;white-space:nowrap;font-weight:800}
.assignment-heading p{font-size:18px;line-height:1.7;color:#57534e;padding-left:25px;border-left:2px solid #fde68a}
.writing-starters{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1.8fr) minmax(0,1fr) minmax(0,1fr);gap:8px;margin:12px 0}
.writing-starter{display:flex;align-items:center;gap:20px;background:#fafaf9;border-radius:13px;padding:5px 18px}
.writing-starter-label{margin:0;display:flex;align-items:center;gap:10px;min-width:160px;font-size:21px;font-weight:900;color:var(--orange)}
.writing-starter-label span{font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;color:#a8a29e;font-size:17px}
.writing-starter p{font-size:24px;line-height:1.5}
.writing-starter:nth-child(even){background:#fffbeb}
.writing-goal{display:flex;align-items:center;gap:12px;font-size:18px;line-height:1.5;background:#ffedd5;color:#9a3412;border-radius:12px;padding:11px 16px}

0,0,0,0);white-space:nowrap;border:0}.reference-dialog{width:min(740px,92vw);max-height:82vh;background:#fffef5;border:0;border-radius:22px;padding:27px 30px;color:var(--ink);box-shadow:0 24px 100px #0005}.reference-dialog::backdrop{background:#1c1917aa}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid #e7e5e4;padding-bottom:14px;margin-bottom:18px}.dialog-head h2{font-size:24px}.dialog-head button{background:white;border:1px solid #d6d3d1;border-radius:8px;padding:5px 11px}.reference-body{font-size:18px;line-height:1.9;white-space:pre-line}.reference-body p+p{margin-top:9px}.reference-intro{font-size:13px;color:var(--muted);margin-bottom:12px}noscript{color:#fff;padding:30px}@media(max-width:650px){.workspace{padding:0 10px}.topbar{height:48px;font-size:11px}.brand{letter-spacing:0}.brand span{display:none}.top-actions{gap:5px}.topbar select{max-width:145px}.utility{padding:6px 8px}.nav{height:73px}.nav-button{padding:8px 10px;font-size:12px}.steps{gap:3px}.step-dot{width:18px;height:20px;font-size:9px}.nav small{font-size:9px}.page-count{margin-left:4px}}@media print{@page{size:1280px 720px;margin:0}html,body{height:auto;overflow:visible}body{background:#fff;print-color-adjust:exact;-webkit-print-color-adjust:exact}.workspace{display:block;width:1280px;padding:0}.topbar,.nav,.reference-dialog{display:none!important}.stage,.frame{display:block;width:1280px;height:auto}.slide,.slide[hidden]{position:relative;display:flex;transform:none;box-shadow:none;break-after:page}.slide:last-child{break-after:auto}.slide{inert:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

/* 課文與詞語各自使用完整一頁。 */
.reading-page .content,.vocabulary-page .content{display:flex;flex-direction:column}
.reading-page .reading{flex:1;min-height:0;margin-top:20px;grid-template-columns:minmax(0,1fr) 300px;gap:24px}
.reading-page .diary{font-size:26px;line-height:1.85;padding:24px 28px;display:flex;flex-direction:column;justify-content:center}
.reading-page .diary p+p{margin-top:16px}.reading-page .word{white-space:nowrap}
.xiaoan-portrait{margin:0;min-height:0;background:#fff7ed;border:2px solid #ffedd5;border-radius:24px;display:flex;flex-direction:column;overflow:hidden}
.xiaoan-portrait svg{display:block;width:100%;flex:1;min-height:0}
.xiaoan-portrait figcaption{padding:13px 16px 20px;text-align:center;background:#fff7ed}
.xiaoan-portrait strong{display:flex;justify-content:center;align-items:center;gap:12px;font-size:28px;font-weight:900}
.xiaoan-portrait strong span{font-size:16px;color:#9a3412;background:#ffedd5;border-radius:99px;padding:4px 10px}
.xiaoan-portrait figcaption p{margin-top:7px;font-size:17px;color:#78716c}
.vocabulary-grid{flex:1;min-height:0;margin-top:20px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:18px}
.vocabulary-card{border:3px solid var(--blue);border-radius:24px;padding:16px 18px;background:white;box-shadow:0 10px 30px #00000008;display:flex;flex-direction:column}
.vocabulary-card:nth-child(even){border-color:var(--orange)}
.vocabulary-heading{display:flex;align-items:center;gap:10px;color:#1d4ed8}
.vocabulary-card:nth-child(even) .vocabulary-heading{color:#c2410c}
.vocabulary-heading>span{align-self:flex-start;margin-top:5px;font-size:13px;font-weight:900;border-bottom:2px solid #bfdbfe;padding-bottom:3px}
.vocabulary-card:nth-child(even) .vocabulary-heading>span{border-color:#fed7aa}
.vocabulary-heading h3{font-size:37px;line-height:1.35;letter-spacing:2px}
.vocabulary-meaning{font-size:17px;line-height:1.65;margin-top:11px}
.vocabulary-context{margin-top:auto;padding-top:9px}
.vocabulary-context>span{display:block;font-size:12px;letter-spacing:2px;color:#78716c;margin-bottom:5px}
.vocabulary-context p{font-size:16px;font-weight:700;line-height:1.5;color:#1d4ed8;background:#eff6ff;border-radius:10px;padding:8px 10px}
.vocabulary-card:nth-child(even) .vocabulary-context p{color:#c2410c;background:#fff7ed}

/* 閱讀理解：兩頁皆保留完整課文，題目置於右欄。 */
.comprehension-page .content{display:flex;flex-direction:column}
.comprehension-layout{flex:1;min-height:0;margin-top:20px;display:grid;grid-template-columns:minmax(0,700px) minmax(0,1fr);gap:24px}
.comprehension-reading{border-left:12px solid var(--orange);padding:22px 24px;display:flex;flex-direction:column;justify-content:center;min-height:0}
.comprehension-reading h3{font-size:24px;line-height:1.4;margin-bottom:14px}
.comprehension-passage{font-size:22px;line-height:1.75;text-align:justify}
.comprehension-passage p+p{margin-top:14px}
.comprehension-passage .word{white-space:nowrap}
.comprehension-tf,.comprehension-written{padding:20px 22px;display:flex;flex-direction:column;min-height:0}
.comprehension-tf h3,.comprehension-written h3{font-size:25px;line-height:1.4}
.comprehension-tf .label,.comprehension-written .label{margin-bottom:7px}
.comprehension-questions{margin-top:6px;flex:1;display:flex;flex-direction:column;justify-content:space-around}
.comprehension-tf .question{font-size:19px;line-height:1.45;padding:7px 0}
.comprehension-tf .question-row{gap:10px}
.comprehension-tf .tf{gap:6px}
.comprehension-tf .option{font-size:19px;width:39px;height:40px;padding:0}
.comprehension-tf .option[aria-pressed="true"]{background:#2563eb;border-color:#1d4ed8;color:#fff;box-shadow:0 0 0 3px #bfdbfe;font-weight:900}
.comprehension-tf .option.correct,.comprehension-tf .option.incorrect{box-shadow:none}
.comprehension-tf .feedback{font-size:15px;line-height:1.6;min-height:48px;margin-top:9px;padding-top:9px;border-top:1px dashed #d6d3d1}
.comprehension-actions{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:8px}
.comprehension-actions .check-btn{background:var(--orange);border-color:var(--orange);font-size:17px;font-weight:900;padding:9px 20px}
.written-questions{flex:1;min-height:0;margin:18px 0 0;padding-left:27px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;font-size:21px;line-height:1.65}
.written-questions li{padding-left:1px}
.written-questions li::marker{color:var(--orange);font-weight:900}
.answer-rules{margin-top:6px}
.answer-rules .paper-line{height:21px;border-bottom:1px solid #e7e5e4;margin:0}

/* 音節由上而下，聲調置於右側，輕聲點置於音節上方。 */
.zhuyin-stack.three{gap:14px}
.zhuyin-stack.three .zhuyin-item{padding:12px 24px 14px}
.zhuyin-stack.three .zhuyin-item .paper-line{height:22px;margin-top:5px}
.zhuyin-stack.three .zhuyin-sentence{display:flex;align-items:center;gap:17px;min-height:84px}
.zhuyin-stack.three .num{font-size:24px;flex-shrink:0;margin:0}
.zhuyin-vertical{display:flex;align-items:center;gap:12px;flex-wrap:nowrap;min-width:0}
.zy-unit{display:inline-flex;align-items:center;gap:4px;flex-shrink:0}
.zy-syllable{position:relative;display:inline-flex;align-items:center;justify-content:flex-start;height:84px;width:40px}
.zy-glyphs{display:flex;flex-direction:column;align-items:center;color:#1c1917;font-family:'Noto Sans TC',sans-serif;font-size:26px;line-height:1;letter-spacing:0}
.zy-glyphs>span{display:block;height:25px;width:26px;text-align:center}
.zy-tone{position:absolute;right:0;bottom:calc((84px - var(--syllable-count) * 25px)/2 + 7px);height:25px;font-size:25px;line-height:1;letter-spacing:0}
.zy-tone.neutral{left:0;right:auto;bottom:auto;top:calc((84px - var(--syllable-count) * 25px)/2 - 19px);width:26px;height:20px;text-align:center;font-size:24px}
.zy-punctuation{font-size:25px;line-height:1;letter-spacing:0;align-self:center;margin-top:44px;margin-bottom:0}

/* 詞語運用拆成兩頁，每頁只保留一組詞卡與一種填空。 */
.vocab-page .content{display:flex;flex-direction:column}
.vocab-layout{flex:1;min-height:0;margin-top:0;display:grid;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto;gap:14px}
.vocab-layout .bank{padding:18px 20px;border-width:4px;display:flex;flex-direction:column;min-height:0}
.vocab-layout .bank h3{font-size:26px;line-height:1.3;margin:0}
.vocab-layout .bank-grid{grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:1fr;gap:10px;margin:12px 0;flex:none;min-height:0}
.vocab-layout .drag-word{font-size:24px;line-height:1.2;padding:10px 7px;min-height:58px;border-radius:14px}
.vocab-layout .bank .secondary{font-size:16px;line-height:1.4;padding:8px 12px;margin-top:0;align-self:flex-end}
.vocab-task{padding:24px 34px;min-height:0;display:flex;flex-direction:column;justify-content:center}
.vocab-task h3{font-size:29px;line-height:1.3;margin-bottom:8px;flex-shrink:0}
.vocab-instruction{font-size:18px;line-height:1.5;color:#78716c;margin-bottom:12px;flex-shrink:0}
.vocab-task ol{font-size:24px;line-height:1.65;margin:0;padding-left:32px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.vocab-task li+li{margin-top:5px}
.vocab-task .drop{font-size:21px;line-height:1.3;min-width:106px;min-height:43px;border-width:3px;padding:2px 9px}
.vocab-short-text{font-size:27px;line-height:2.15;margin:12px 0}
.vocab-short-text .drop{font-size:21px;min-width:106px;min-height:43px}
.vocab-layout .score-row{grid-column:1 / -1;margin-top:0;align-self:center;display:flex;align-items:center;gap:14px}.vocab-layout .score-row .feedback{flex:1}.vocab-layout .score-row .check-btn{flex-shrink:0}
.vocab-layout .feedback{font-size:17px}

/* 上方選詞、下方填空；提交前只顯示填答狀態。 */
.vocab-layout .bank{padding:12px 22px;border-width:3px;border-style:solid;border-color:#e7e5e4}
.vocab-layout .bank-grid{margin:0;gap:14px}
.vocab-layout .drag-word{border-radius:10px;min-height:54px;font-size:26px;padding:7px 10px}
.vocab-task{padding:14px 32px}
.vocab-task h3,.vocab-task .vocab-instruction{display:none}
.vocab-task ol{flex:1;gap:0;font-size:25px;line-height:1.5}
.vocab-task li+li{margin-top:3px}
.vocab-task .drop{border:3px dashed #f59e0b;border-radius:6px;min-width:122px;min-height:42px;font-size:23px;line-height:1.25;background:#fff7cc;color:transparent;padding:2px 9px;box-shadow:inset 0 -2px 0 #fde68a}
.vocab-task .drop.filled{border-style:solid;border-color:#ea580c;background:#fef08a;color:#1c1917;box-shadow:none}
.vocab-task .drop.over{border-color:#c2410c;background:#fef08a}.vocab-task .drop.correct{border-color:#16a34a!important;background:#dcfce7!important;color:#166534!important}.vocab-task .drop.incorrect{border-color:#dc2626!important;background:#fee2e2!important;color:#991b1b!important}
.vocab-layout .score-row{min-height:43px;gap:12px}
.vocab-layout .feedback{margin-top:0;line-height:1.5}
.vocab-layout .score{font-size:15px;padding:7px 12px}
.vocab-layout .check-btn{background:var(--orange);border-color:var(--orange);font-size:17px;font-weight:900;padding:9px 20px}
.vocab-short-text{font-size:30px;line-height:2.4;margin:0}

/* 放大詞語填空的目標，拖近空格也可放入。 */
.vocab-task .drop{min-width:136px;min-height:50px}
.vocab-task .drop.drop-ready{outline:3px solid #fde68a;outline-offset:3px}
.vocab-task .drop.over{background:#fde047;border-color:#ea580c;outline:4px solid #fdba74;outline-offset:4px;box-shadow:0 0 0 9px #ffedd580}
.vocab-task .drop.filled{cursor:grab}
.vocab-task .drop.dragging{opacity:.45}

/* 確認整組正確後的鼓勵動畫；不攔截學生操作。 */
.success-celebration{position:absolute;inset:0;z-index:20;pointer-events:none;display:flex;align-items:center;justify-content:center}
.success-banner{position:relative;z-index:1;width:540px;padding:26px 30px;border:4px solid #fde047;border-radius:26px;background:#fffef5;box-shadow:0 14px 55px #1c191740;text-align:center;animation:success-pop .45s cubic-bezier(.2,.9,.3,1.3) both}
.success-medal{display:grid;place-items:center;width:76px;height:76px;margin:0 auto 13px;background:#fef08a;color:#a16207;border-radius:50%;font-size:38px}
.success-banner strong{display:block;font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;font-size:34px;color:#166534;line-height:1.5}
.success-banner p{margin-top:9px;font-size:20px;line-height:1.7;color:#57534e}
.success-confetti{position:absolute;left:var(--x);top:12%;width:12px;height:20px;background:var(--color);border-radius:3px;opacity:0;animation:success-confetti 1.8s var(--delay) ease-out both}
.check-btn.success-button{background:#166534!important;border-color:#166534!important;animation:success-button .55s ease-in-out 2}
@keyframes success-pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes success-confetti{0%{opacity:0;transform:translate(0,-30px) rotate(0)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translate(var(--drift),510px) rotate(var(--spin))}}
@keyframes success-button{50%{transform:scale(1.08);box-shadow:0 0 0 7px #bbf7d055}}
@media(prefers-reduced-motion:reduce){.success-banner,.check-btn.success-button{animation:none}.success-confetti{display:none}}
@media print{.success-celebration{display:none!important}}


/* 紙上作答：每題完成勾選與每頁確認。 */
.paper-check{display:inline-flex;align-items:center;gap:7px;color:#78716c;font-size:15px;font-weight:700;line-height:1.5;white-space:nowrap;cursor:pointer;background:#fffef5;border-radius:8px;padding:3px 8px}
.paper-check input{width:22px;height:22px;accent-color:#16a34a;margin:0;flex-shrink:0;cursor:pointer}
.paper-check:has(input:checked){background:#f0fdf4;color:#166534}
.paper-line.paper-check-line{position:relative}
.paper-check-line>.paper-check{position:absolute;right:0;bottom:3px}
.writing-starter>.paper-check{margin-left:auto}
.order-exercise{position:relative}
.order-exercise>.paper-check{position:absolute;right:22px;top:24px}
.paper-completion-bar{display:flex;align-items:center;gap:16px;flex:1;min-width:0}
.paper-completion-status{font-size:15px;line-height:1.5;color:#57534e;flex:1}
.paper-completion-status.good{color:#166534}.paper-completion-status.bad{color:#b91c1c}
.paper-completion-bar .check-btn{padding:7px 18px;background:#ea580c;border-color:#ea580c;font-weight:900;font-size:16px;flex-shrink:0}
.has-paper-completion .zhuyin-stack.three{gap:6px}
.has-paper-completion .token-bank{min-height:98px}
.has-paper-completion .token-target{min-height:110px}
.has-paper-completion.combine-page .combine-demo{padding-top:16px;padding-bottom:16px}
.has-paper-completion .footer{align-items:center;padding-top:9px;margin-top:12px}
.final .paper-completion-status{color:#fefce8}.final .paper-completion-status.good{color:#fde047}.final .paper-completion-status.bad{color:#fdba74}
@media print{.paper-completion-bar .check-btn{display:none}.paper-check{color:#57534e;background:transparent}}


/* 句型轉換與合併句子的紙上練習：題目、提示、作答、完成分區。 */
.combine-page .combine-layout{margin-bottom:2px}
.combine-page .combine-practice{padding:16px 22px}
.combine-practice .combine-card-head{padding-bottom:8px;margin-bottom:10px}
.combine-practice .combine-practice-original{padding:12px 18px}
.combine-practice .combine-practice-original p{font-size:24px;line-height:1.55}
.combine-practice .combine-cue{margin-top:12px;font-size:17px}
.combine-practice .combine-cue b{font-size:21px;padding:4px 13px}
.combine-practice .combine-paper{padding-top:10px}
.combine-practice .combine-paper-title{font-size:18px;margin-bottom:2px}
.combine-practice .combine-paper .paper-line{height:20px}
.combine-practice .combine-paper-note{font-size:14px;line-height:1.5;margin-top:8px}
.combine-completion{border-top:1px solid #e7e5e4;margin-top:9px;padding-top:9px;display:flex;justify-content:flex-end}
.combine-completion .paper-check{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:5px 11px}
.combine-completion .paper-check:has(input:checked){background:#f0fdf4;border-color:#bbf7d0;color:#166534}


/* 封底的學習完成主按鈕。 */
.finish-learning{display:flex;align-items:center;justify-content:center;gap:15px;width:100%;min-height:78px;margin-top:18px;padding:15px 26px;border:0;border-radius:19px;background:#fde047;color:#1c1917;box-shadow:0 6px 0 #a16207;font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;font-size:32px;line-height:1.4}
.finish-learning:hover{background:#fef08a}
.finish-learning:active{transform:translateY(3px);box-shadow:0 3px 0 #a16207}
.finish-learning.success-button{background:#bbf7d0;color:#166534;box-shadow:0 6px 0 #15803d}
.final.has-paper-completion .footer .paper-completion-bar{min-height:27px}
@media print{.finish-learning{display:none}}


#reference-auth label{display:block;font-size:19px;font-weight:700;margin-bottom:12px}
.reference-auth-row{display:flex;align-items:center;gap:12px}
#reference-password{flex:1;min-width:0;border:2px solid #d6d3d1;border-radius:11px;background:#fff;padding:11px 14px;font-size:20px}
.reference-auth-row .check-btn{padding:13px 20px;font-size:17px;background:#ea580c;border-color:#ea580c;font-weight:700}
#reference-auth-error{min-height:26px;margin-top:12px;font-size:16px;line-height:1.6;color:#b91c1c}

/* 滿版閱讀：縮小外圍留白，讓文字、圖像與題目使用可用空間。 */
.slide{padding:24px 30px 16px}
.title-row{margin-top:7px}
.title-row h2{font-size:46px}
.guide{margin:8px 0 14px;font-size:20px}
.footer{margin-top:12px;padding-top:9px}
.reading-page .reading,.vocabulary-grid,.comprehension-layout{margin-top:14px;gap:16px}
.reading-page .diary{font-size:28px;line-height:1.8;padding:22px 26px}
.vocabulary-card{padding:18px}
.vocabulary-heading h3{font-size:40px}
.vocabulary-meaning{font-size:19px;line-height:1.65}
.vocabulary-context p{font-size:18px}
.comprehension-layout{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.comprehension-passage{font-size:23px;line-height:1.75}

<style id="track-page-compat">/* 平台從 #track 的 translateX 讀目前頁；這份的頁是疊在一起用 hidden 切換，畫面不能跟著位移 */#track{transform:none!important}</style>
</head>
<body>
<div id="root"><div class="boot-status" role="status">教材載入中…</div></div>
<script>
/* ===== EduBaania 平台橋接 platform-bridge.js（2026-10-27 版，對齊 frontend-monorepo main 5e73f9335）=====
 * 放法：整段包一層 script 標籤，貼在 body 裡、你自己的程式 script「前面」（註解與字串裡不可出現字面的 script 結束標籤）。
 * React 這類一載入就讀存檔的程式，橋接與 init() 都要先於 bundle 執行。
 *
 *   EduBridge.init({
 *     handoutId: '這份檔案的唯一代號',     // 必填：建議用檔名；每份檔案唯一（不可照抄）；可用中文，不可有空白、底線 _、斜線 /
 *     totalQuestions: 12,                // 必填：計分題總數，0 以上整數；純閱讀填 0
 *     onSetPage: function (page, clearedUpTo) {},  // 選填：只有 #track > .page 分頁式才需要（規範 §4.2、§4.3）
 *     onZhuyin: function (enabled) {},   // 選填：不用平台 runtime、自己管注音字型時才需要
 *   });
 *   EduBridge.recordAnswer('q3', true, 4200);   // 每次作答都呼叫（對錯都要）；第 3 參數＝這題出現（或上次作答）到這次作答的毫秒數
 *   EduBridge.answeredCount() >= EduBridge.totalQuestions   // 每一題都作答過了沒：完成鈕在這之後才開放（規範 §6 第 6 步）
 *   EduBridge.complete();                        // 學生按「完成」時呼叫；一次載入只送一次
 *   EduBridge.complete({ totalQuestions: 10, correctAnswers: 8 });  // 只在完全沒接 recordAnswer 時用；有逐題紀錄時 correctAnswers 會被忽略
 *   EduBridge.progress(page, totalPages, '第 2 關', 35);  // 一頁一頁翻的才送（規範 §4.2）；第 4 個參數＝百分比，監控面板顯示「閱讀中 35%」
 *   EduBridge.storage.get('myState', {}) / .set('myState', obj)   // 取代 localStorage；鍵名不可用 __eb_ 開頭（保留給橋接）
 *   EduBridge.lastCompletedAt()                  // 上次送完成的時間（ISO），只拿來顯示「已完成」，不要拿來擋完成鈕
 */
(function () {
  'use strict';
  if (window.EduBridge) return;

  var RESERVED = '__eb_';

  function warn(msg) { try { console.warn('[EduBridge] ' + msg); } catch (e) { /* 沒有 console 也不能壞 */ } }

  function postToParent(type, data) {
    try {
      window.parent.postMessage({ type: type, data: data || {}, source: 'eduTemplate', timestamp: Date.now() }, '*');
    } catch (e) { /* 不在 iframe 裡也不能壞 */ }
  }

  // 平台用 srcdoc 載入：自己的網址恆為 about:srcdoc，存檔鍵要讀父頁網址。
  // 一個任務 id 只對應一個日期（baania-core StudentTask），所以只取 id，不接日期：同一任務從任何入口進來都同一把鍵。
  function resolveInstanceId() {
    var iid = '';
    try {
      var q = new URLSearchParams(location.search);
      iid = q.get('instanceId') || q.get('taskId') || '';
      if (!iid) {
        var pl = window.parent !== window ? window.parent.location : location;
        var m = pl.pathname.match(/\/(?:tasks?|resource)\/([^\/?#]+)/);   // /tasks/<id>、/task/<id>、/resource/<id>
        iid = m ? m[1] : (new URLSearchParams(pl.search).get('res') || '');  // 高中版 reader/comic 用 ?res=
      }
    } catch (e) { /* 跨網域讀不到父頁時退回 default，靠 handoutId 區分 */ }
    return iid || 'default';
  }

  function isObj(v) { return !!v && typeof v === 'object' && !Array.isArray(v); }

  function makeStore(prefix) {
    function raw(k) { try { var v = localStorage.getItem(prefix + k); return v == null ? undefined : JSON.parse(v); } catch (e) { return undefined; } }
    function put(k, v) { try { localStorage.setItem(prefix + k, JSON.stringify(v)); } catch (e) { /* Safari 無痕／滿了：靜默降級 */ } }
    function del(k) { try { localStorage.removeItem(prefix + k); } catch (e) { /* 同上 */ } }
    function own(k) {
      if (String(k).indexOf(RESERVED) === 0) { warn('存檔鍵不可用 ' + RESERVED + ' 開頭（保留給橋接）：' + k); return false; }
      return true;
    }
    var user = {
      get: function (k, d) { var v = raw(k); return v === undefined ? d : v; },
      set: function (k, v) { if (own(k)) put(k, v); },
      remove: function (k) { if (own(k)) del(k); },
      // 只清這份講義的作答畫面；首答紀錄（__eb_）保留，否則「重來」就能把答錯洗成第一次就對。
      // 絕對不要清空整個 localStorage（講義和學生端同網域，會把學生登出）
      clearAll: function () {
        try {
          Object.keys(localStorage).forEach(function (k) {
            if (k.indexOf(prefix) === 0 && k.indexOf(prefix + RESERVED) !== 0) localStorage.removeItem(k);
          });
        } catch (e) { /* 同上 */ }
      }
    };
    user.load = user.get; user.save = user.set; user.getItem = user.get; user.setItem = user.set; user.removeItem = user.remove;
    var internal = {
      get: function (k, d) { var v = raw(RESERVED + k); return v === undefined ? d : v; },
      set: function (k, v) { put(RESERVED + k, v); }
    };
    return { user: user, internal: internal };
  }

  function isCount(n) { return typeof n === 'number' && isFinite(n) && n >= 0 && Math.floor(n) === n; }

  var cfg = null, store = null;
  var S = { startedAt: Date.now(), first: {}, tries: {}, guessing: 0, combo: 0, maxCombo: 0, log: [], done: false, payload: null };

  function announceReady() {
    // 意思是「橋接已在聽下行指令」，不是「畫面已畫好」；平台收到後只會收起載入畫面、送 SET_ZHUYIN
    postToParent('game:ready', {
      totalPages: cfg.totalPages || 0,
      totalQuestions: cfg.totalQuestions,
      protocolVersion: '1.1',
      engineVersion: cfg.engineVersion || 'bridge-2026-10',
      capabilities: ['game:ready', 'TASK_COMPLETED', 'REQUEST_READY']
        .concat(cfg.onZhuyin ? ['SET_ZHUYIN'] : [])
        .concat(cfg.onSetPage ? ['PROGRESS_UPDATE', 'SET_PAGE'] : []),
      timestamp: Date.now()
    });
  }

  function onMessage(e) {
    var m = e.data;
    if (!m || m.source !== 'eduPlatform') return;
    var d = m.data || {};
    if (m.type === 'REQUEST_READY') announceReady();
    else if (m.type === 'SET_PAGE' && typeof d.page === 'number' && cfg.onSetPage) {
      // clearedUpTo 與 page 同基準；老師畫筆跳頁不帶（不可替學生解鎖），老師端鏡像頁帶 page（先解鎖再跳）
      cfg.onSetPage(d.page, typeof d.clearedUpTo === 'number' ? d.clearedUpTo : null);
    } else if (m.type === 'SET_ZHUYIN' && cfg.onZhuyin) cfg.onZhuyin(!!d.enabled);
    // 其他 type 一律忽略（向下相容）
  }

  function init(options) {
    if (cfg) { warn('init 只能呼叫一次，已忽略第二次'); return; }
    if (!options) throw new Error('EduBridge.init 需要參數');
    var hid = options.handoutId;
    if (typeof hid !== 'string' || !hid || /[\s_\/]/.test(hid)) {
      throw new Error('EduBridge.init 的 handoutId 必須是非空字串，且不可有空白、底線 _、斜線 /（建議用檔名），收到：' + hid);
    }
    if (!isCount(options.totalQuestions)) {
      throw new Error('EduBridge.init 的 totalQuestions 必須是 0 以上的整數（純閱讀填 0），收到：' + options.totalQuestions);
    }
    cfg = options;
    EduBridge.handoutId = hid;
    EduBridge.totalQuestions = options.totalQuestions;
    var st = makeStore('edu_' + resolveInstanceId() + '_' + hid + '_');
    store = st.internal;
    EduBridge.storage = st.user;
    window.EduStorage = st.user;                     // 舊程式碼若呼叫 EduStorage.* 也接得上
    // 首答紀錄要存：重新整理不能把答錯洗成「第一次就對」
    S.first = isObj(store.get('first')) ? store.get('first') : {};
    S.tries = isObj(store.get('tries')) ? store.get('tries') : {};
    S.guessing = isCount(store.get('guessing')) ? store.get('guessing') : 0;
    window.addEventListener('message', onMessage);   // 先掛 listener 再宣告 ready
    S.log.push({ event: 'session:start', ts: Date.now() });
    announceReady();
  }

  function recordAnswer(questionId, correct, timeMs, guessThresholdMs) {
    if (!cfg) { warn('recordAnswer 在 init 之前呼叫，已忽略'); return; }
    if (S.done) return;
    if (questionId == null || questionId === '') { warn('recordAnswer 缺題號，已忽略'); return; }
    var qid = String(questionId);
    var ok = correct === true || correct === 1;
    if (!(qid in S.first)) { S.first[qid] = ok; store.set('first', S.first); }
    S.tries[qid] = (S.tries[qid] || 0) + 1;
    store.set('tries', S.tries);
    if (ok) { S.combo += 1; if (S.combo > S.maxCombo) S.maxCombo = S.combo; }
    else {
      S.combo = 0;
      if (typeof timeMs === 'number' && timeMs < (guessThresholdMs || 2000)) {
        S.guessing += 1;
        store.set('guessing', S.guessing);
      }
    }
    S.log.push({ event: 'answer', ts: Date.now(), data: { questionId: qid, correct: ok, timeMs: timeMs, attempt: S.tries[qid] } });
  }

  function progress(page, totalPages, section, percent) {
    if (!cfg) { warn('progress 在 init 之前呼叫，已忽略'); return; }
    var d = { page: Math.max(0, page), totalPages: totalPages };
    if (section != null) d.section = String(section);
    if (typeof percent === 'number') d.percent = Math.max(0, Math.min(100, percent));
    postToParent('PROGRESS_UPDATE', d);
  }

  function rewardConfig(total) {
    var u = isObj(window.EDU_REWARD) ? window.EDU_REWARD : {};
    function num(v, d, max) { return typeof v === 'number' && isFinite(v) && v >= 0 ? Math.min(v, max) : d; }
    return {
      maxXp: num(u.maxXp, 50, 50),
      maxCoins: num(u.maxCoins, 20, 20),
      completionOnly: typeof u.completionOnly === 'boolean' ? u.completionOnly : total === 0
    };
  }

  // 獎勵回報規範 v2：上限 50/20、首答正確率 < 60% → 2/0、純閱讀 → 25/10；version: 2 必帶，否則平台整組丟掉
  // stats（選填）：原程式自己算好的成績 { totalQuestions, correctAnswers?, guessingCount?, maxCombo? }；
  // 沒給 correctAnswers 就沿用 recordAnswer 累積的首答數
  function complete(stats) {
    if (!cfg) { warn('complete 在 init 之前呼叫，已忽略'); return; }
    if (S.done) return;
    S.done = true;
    var total = cfg.totalQuestions, correct = 0, answered = 0;
    for (var k in S.first) { answered += 1; if (S.first[k]) correct += 1; }
    if (isObj(stats) && isCount(Math.round(stats.totalQuestions))) {
      // 題數只能比 init 多、不能少：拿「已作答題數」當題數，只答一題答對就是滿分
      if (Math.round(stats.totalQuestions) < total) warn('complete 的 totalQuestions 少於 init 的 ' + total + '，改用 ' + total);
      total = Math.max(total, Math.round(stats.totalQuestions));
      if (typeof stats.correctAnswers === 'number' && isFinite(stats.correctAnswers)) {
        // 有逐題 recordAnswer 紀錄時以首答為準：原程式自己數的多半是「最後答對」，重答到全對就變滿分
        if (answered > 0) {
          if (Math.round(stats.correctAnswers) !== correct) {
            warn('已有逐題作答紀錄，忽略 complete 傳入的 correctAnswers（' + stats.correctAnswers + '），改用首答數 ' + correct);
            S.log.push({ event: 'bridge:warn', ts: Date.now(), data: { ignoredCorrectAnswers: stats.correctAnswers, firstTryCorrect: correct } });
          }
        } else correct = Math.max(0, Math.round(stats.correctAnswers));
      }
      if (typeof stats.guessingCount === 'number' && isFinite(stats.guessingCount)) S.guessing = Math.max(0, Math.round(stats.guessingCount));
      if (typeof stats.maxCombo === 'number' && isFinite(stats.maxCombo)) S.maxCombo = Math.max(0, Math.round(stats.maxCombo));
    } else if (answered > total) {
      warn('作答過 ' + answered + ' 題，但 totalQuestions 是 ' + total + '：題數設錯了');
      S.log.push({ event: 'bridge:warn', ts: Date.now(), data: { answered: answered, totalQuestions: total } });
    }
    if (answered < total) S.log.push({ event: 'bridge:warn', ts: Date.now(), data: { answered: answered, totalQuestions: total, note: 'completed before all answered' } });
    if (correct > total) correct = total;
    var rawAcc = total ? correct / total : 1;
    var accuracy = Math.round(rawAcc * 100) / 100;
    var rw = rewardConfig(total);
    var fail = !rw.completionOnly && rawAcc < 0.6;   // 用未四捨五入的值比 60%（0.595 不算及格）
    var ratio = rw.completionOnly ? 0.5 : (fail ? 0 : 0.5 + 0.5 * (rawAcc - 0.6) / 0.4);
    var xp = fail ? 2 : Math.round(rw.maxXp * ratio);
    var coins = fail ? 0 : Math.round(rw.maxCoins * ratio);
    var badges = [];
    if (accuracy >= 0.8) badges.push('accuracy_high');
    if (S.guessing === 0) badges.push('no_guess');
    var totalTimeMs = Date.now() - S.startedAt;
    S.log.push({ event: 'task:complete', ts: Date.now(), data: { score: accuracy, timeMs: totalTimeMs } });
    S.payload = {
      achievedScore: accuracy,                       // 0–1，不是 0–100
      completedAt: new Date().toISOString(),
      performance: { totalQuestions: total, correctAnswers: correct, accuracy: accuracy,
        maxCombo: S.maxCombo, guessingCount: S.guessing, totalTimeMs: totalTimeMs },
      suggestedRewards: { version: 2, xp: Math.min(50, xp), coins: Math.min(20, coins), badges: badges },
      sessionLog: S.log                              // 陣列，不是物件
    };
    postToParent('TASK_COMPLETED', S.payload);
    store.set('completedAt', S.payload.completedAt);
  }

  function lastCompletedAt() { return store ? store.get('completedAt', null) : null; }
  // 作答過的不同題號數（含重新整理前的紀錄；首答紀錄存在存檔裡）
  function answeredCount() { var n = 0; for (var k in S.first) { if (Object.prototype.hasOwnProperty.call(S.first, k)) n += 1; } return n; }

  var EduBridge = { init: init, recordAnswer: recordAnswer, progress: progress, complete: complete,
    lastCompletedAt: lastCompletedAt, answeredCount: answeredCount, storage: null, handoutId: null, totalQuestions: null,
    postToParent: postToParent };
  window.EduBridge = EduBridge;
  window.postToParent = postToParent;
  window.sendTaskComplete = complete;
})();

</script>

<script>
window.WritingLesson={mount(){
'use strict';
document.getElementById('root').innerHTML="<div class=\"workspace\">\n<header class=\"topbar\"><div class=\"brand\"><i class=\"fa-solid fa-magnifying-glass\" aria-hidden=\"true\"></i> 生活小偵探 <span>／ 國小寫作教材</span></div><div class=\"top-actions\"><label class=\"sr-only\" for=\"jump\">選擇教材區塊</label><select id=\"jump\"></select><button class=\"utility\" id=\"reference\" type=\"button\" aria-label=\"開啟教師參考解答\" title=\"教師參考解答\"><i class=\"fa-regular fa-lightbulb\" aria-hidden=\"true\"></i></button><button class=\"utility\" id=\"full\" type=\"button\" aria-label=\"切換全螢幕\"><i class=\"fa-solid fa-expand\" aria-hidden=\"true\"></i></button></div></header>\n<main class=\"stage\" aria-label=\"互動教材\"><div class=\"frame\" id=\"track\"></div></main>\n<nav class=\"nav\" aria-label=\"簡報翻頁\"><button class=\"nav-button\" id=\"prev\" type=\"button\"><i class=\"fa-solid fa-arrow-left\" aria-hidden=\"true\"></i> 上一頁</button><div class=\"nav-middle\"><div class=\"steps\" aria-label=\"教材區塊\"></div><small>← → 翻頁 · 小螢幕建議橫向閱讀 <span class=\"page-count\" id=\"count\"></span></small></div><button class=\"nav-button\" id=\"next\" type=\"button\">下一頁 <i class=\"fa-solid fa-arrow-right\" aria-hidden=\"true\"></i></button></nav>\n<p class=\"sr-only\" id=\"announcement\" role=\"status\" aria-live=\"polite\"></p>\n</div>\n<dialog class=\"reference-dialog\" id=\"reference-dialog\" aria-labelledby=\"reference-title\"><div class=\"dialog-head\"><h2 id=\"reference-title\">教師參考解答</h2><button id=\"close-reference\" type=\"button\" aria-label=\"關閉參考解答\">✕</button></div><div id=\"reference-auth\"><label for=\"reference-password\">請輸入密碼</label><div class=\"reference-auth-row\"><input id=\"reference-password\" name=\"reference-password\" type=\"password\" autocomplete=\"off\" aria-describedby=\"reference-auth-error\" autofocus><button class=\"check-btn\" type=\"button\" id=\"reference-open\">開啟解答</button></div><p id=\"reference-auth-error\" role=\"status\"></p></div><div id=\"reference-content\" hidden><p class=\"reference-intro\">先試著作答，再核對。仿寫及理由題可以有不同的合理答案。</p><div class=\"reference-body\" id=\"reference-body\"></div></div></dialog>\n";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=name=>`<i class="fa-solid fa-${name}" aria-hidden="true"></i>`;
const line=()=>'<div class="paper-line" aria-hidden="true"></div>';
const CONTENT=window.COURSE_DATA,ASSETS=window.MEDIA_ASSETS;
if(!CONTENT||!Array.isArray(CONTENT.pages)||!CONTENT.pages.length)throw new Error('Missing lesson pages');
const UI=CONTENT.uiText||{};
document.title=`第 ${CONTENT.lesson.number} 課｜${CONTENT.lesson.title}`;
const blocks=CONTENT.blocks;
const rawPages=CONTENT.pages;
const references=[];
const safeRich=value=>{const t=document.createElement('template');t.innerHTML=String(value??'');const walk=node=>{for(const el of [...node.children]){if(!['BR','SPAN','STRONG'].includes(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue;}for(const a of [...el.attributes])if(a.name!=='class')el.removeAttribute(a.name);walk(el);}};walk(t.content);return t.innerHTML;};
const rich=s=>safeRich(s);
const lessonWords=CONTENT.lesson.vocabulary.map(v=>v[0]);
const lessonParagraphs=CONTENT.lesson.paragraphs.map(p=>{let text=escapeHTML(p);for(const w of [...lessonWords].sort((a,b)=>b.length-a.length))text=text.replaceAll(escapeHTML(w),`<strong class="word">${escapeHTML(w)}</strong>`);return `<p>${text}</p>`}).join('');
const passage=()=>`<article class="card comprehension-reading" aria-label="完整課文：${escapeHTML(CONTENT.lesson.title)}"><h3>${escapeHTML(CONTENT.lesson.title)}</h3><div class="comprehension-passage">${lessonParagraphs}</div></article>`;
function asset(slot,alt=''){
 const value=ASSETS.images?.[slot];
 if(typeof value==='string'&&value.trim().startsWith('<svg')){const t=document.createElement('template');t.innerHTML=value;for(const el of t.content.querySelectorAll('*')){if(['script','foreignObject','iframe'].includes(el.tagName)){el.remove();continue;}for(const a of [...el.attributes])if(a.name.startsWith('on')||/javascript:/i.test(a.value))el.removeAttribute(a.name);}return t.innerHTML;}
 if(typeof value==='string'&&/^(https?:|data:image\/)/.test(value))return `<img class="lesson-image" src="${escapeHTML(value)}" alt="${escapeHTML(alt)}">`;
 return `<div class="media-fallback" role="img" aria-label="${escapeHTML(alt)}">${escapeHTML(alt||'圖片暫時無法載入')}</div>`;
}
function zyVertical(text){
 const tokens=text.match(/˙?[ㄅ-ㄩ]+[ˊˇˋ]?|[，。！？；：]/g)||[];
 return `<span class="zhuyin-vertical" role="text" aria-label="${escapeHTML(text)}">${tokens.map(token=>{if(/^[，。！？；：]$/.test(token))return `<span class="zy-punctuation" aria-hidden="true">${token}</span>`;const tone=token.match(/[ˊˇˋ˙]/)?.[0]||'',letters=token.replace(/[ˊˇˋ˙]/g,'');return `<span class="zy-unit" aria-hidden="true"><span class="zy-syllable" style="--syllable-count:${letters.length}"><span class="zy-glyphs">${[...letters].map(ch=>`<span>${ch}</span>`).join('')}</span>${tone?`<span class="zy-tone ${tone==='˙'?'neutral':''}">${tone}</span>`:''}</span></span>`}).join('')}</span>`;
}
const drop=(w,i)=>`<button type="button" class="drop" data-answer="${escapeHTML(w)}" aria-label="詞語第 ${i+1} 格，尚未填答"></button>`;
const gapParts=parts=>parts.map((text,i)=>i%2?drop(text,(i-1)/2):escapeHTML(text)).join('');
const countFor=p=>p.type==='vocabulary'?CONTENT.lesson.vocabulary.length:p.content.questions?.length??p.content.practice?.length??p.content.items?.length??(p.type==='vocab-short'?(p.content.parts.length-1)/2:p.content.checklist?.length??0);
function wordsIn(p,text){const patterns=rawPages.filter(p=>p.type==='pattern');return String(text??'').replaceAll('{count}',countFor(p)).replaceAll('{bankCount}',p.content.bank?.length??0).replaceAll('{patternCount}',patterns.length).replaceAll('{patternIndex}',patterns.indexOf(p)+1);}
function bodyFor(p){const c=p.content,esc=escapeHTML;
 switch(p.type){
 case 'cover':return `<div class="content cover-layout"><div><div class="eyebrow">${icon('fingerprint')} ${esc(c.eyebrow)}</div><h1 tabindex="-1">${rich(c.headingHtml)}</h1><p>${rich(c.introHtml)}</p><div class="pill-row">${c.pills.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div><button class="primary" type="button" data-go="1">${esc(c.start)} ${icon('arrow-right')}</button></div><div class="cover-art" aria-hidden="true"><div class="circle"></div><span class="art-note">${esc(c.artNote)}</span>${c.tiles.map((t,i)=>`<div class="tile t${i+1}">${esc(t)}</div>`).join('')}</div></div>`;
 case 'reading':return `<div class="reading"><article class="card diary">${lessonParagraphs}</article><figure class="xiaoan-portrait">${asset(c.illustrationSlot,c.name)}<figcaption><strong>${esc(c.name)}<span>${esc(c.age)}</span></strong><p>${esc(c.caption)}</p></figcaption></figure></div>`;
 case 'vocabulary':return `<div class="vocabulary-grid">${CONTENT.lesson.vocabulary.map(([word,meaning,phrase],i)=>`<article class="vocabulary-card"><div class="vocabulary-heading"><span>${String(i+1).padStart(2,'0')}</span><h3>${esc(word)}</h3></div><p class="vocabulary-meaning">${esc(meaning)}</p><div class="vocabulary-context"><span>課文搭配</span><p>${esc(phrase)}</p></div></article>`).join('')}</div>`;
 case 'truefalse':return `<div class="comprehension-layout">${passage()}<article class="card comprehension-tf"><div class="label">A · 判斷課文內容</div><h3>哪一句符合課文？</h3><div class="comprehension-questions">${c.questions.map((q,i)=>`<div class="question" data-tf="${i}" data-answer="${esc(q[1])}"><div class="question-row"><span>${i+1}. ${esc(q[0])}</span><span class="tf">${[['O','○','正確'],['X','×','不正確']].map(([v,t,l])=>`<button class="option" type="button" data-value="${v}" aria-pressed="false" aria-label="第${i+1}題${l}">${t}</button>`).join('')}</span></div></div>`).join('')}</div><div class="comprehension-actions"><button class="check-btn" type="button" data-check-reading>${esc(UI.confirm)}</button></div><p class="feedback" id="reading-feedback" role="status">選 ○ 或 ×，全部完成後按「${esc(UI.confirm)}」。</p></article></div>`;
 case 'written':return `<div class="comprehension-layout">${passage()}<article class="card comprehension-written"><div class="label">B · 找出課文線索</div><h3>請在紙上回答</h3><ol class="written-questions">${c.questions.map(q=>`<li><p>${esc(q)}</p><div class="answer-rules" aria-hidden="true">${line()}${line()}</div></li>`).join('')}</ol></article></div>`;

  const values=[...ex.querySelectorAll('[data-placed]')].map(t=>q.tokens[Number(t.dataset.placed)]);

  recordAnswer(index,'order-'+ex.dataset.order,values,ok,'other');

},true);
document.addEventListener('drop',event=>{const slide=event.target.closest('.slide');if(!slide)return;const index=Number(slide.dataset.page);invalidate(index);if(typeAt(index)==='order')orderVerified.delete(event.target.closest('.order-exercise'));},true);
document.addEventListener('change',event=>{if(event.target.matches('.paper-check input,.check-row input')){const index=indexOf(event.target);restoredDone.delete(index);SessionRecorder.record('paper:check',{pageId:pages[index].id,checked:event.target.checked});queueMicrotask(syncNav)}},true);
slides.forEach((slide,index)=>{
 const confirm=slide.querySelector('[data-confirm-paper],[data-finish-learning]');if(!confirm)return;
 const original=confirm.onclick;
 confirm.onclick=()=>{
  const final=typeAt(index)==='final';
  if(final&&!slides.slice(0,-1).every((_,i)=>pageComplete(i))){gateMessage();return}
  if(typeAt(index)==='order'&&!objectiveComplete(index)){gateMessage('請先完成每題的詞語排列並確認答案，再確認紙上練習完成。');return}
  original();
  if(slide.dataset.paperConfirmed!=='true')return;
  if(!final){[...slide.querySelectorAll('.paper-check input')].forEach((check,i)=>recordAnswer(index,'paper-'+i,'completed',null,'paper'));SessionRecorder.record('paper:confirmed',{pageId:pages[index].id,count:slide.querySelectorAll('.paper-check input').length})}
  syncNav();
  if(final)sendTaskComplete();
 };
});
// Pointer-based touch drag uses the same HTML5 handlers as mouse drag.
let pointerDrag=null;
document.addEventListener('pointerdown',event=>{
 if(event.pointerType==='mouse'||event.button!==0)return;
 const el=event.target.closest('[draggable="true"]');if(!el||el.disabled)return;
 pointerDrag={el,id:event.pointerId,x:event.clientX,y:event.clientY,active:false,dt:new DataTransfer()};el.setPointerCapture?.(event.pointerId);
});
document.addEventListener('pointermove',event=>{
 const drag=pointerDrag;if(!drag||drag.id!==event.pointerId)return;
 if(!drag.active&&Math.hypot(event.clientX-drag.x,event.clientY-drag.y)>8){drag.active=true;drag.el.dispatchEvent(new DragEvent('dragstart',{bubbles:true,cancelable:true,dataTransfer:drag.dt}))}
 if(!drag.active)return;event.preventDefault();document.elementFromPoint(event.clientX,event.clientY)?.dispatchEvent(new DragEvent('dragover',{bubbles:true,cancelable:true,dataTransfer:drag.dt,clientX:event.clientX,clientY:event.clientY}));
},{passive:false});
document.addEventListener('pointerup',event=>{
 const drag=pointerDrag;if(!drag||drag.id!==event.pointerId)return;pointerDrag=null;
 if(drag.active){event.preventDefault();document.elementFromPoint(event.clientX,event.clientY)?.dispatchEvent(new DragEvent('drop',{bubbles:true,cancelable:true,dataTransfer:drag.dt,clientX:event.clientX,clientY:event.clientY}));drag.el.dispatchEvent(new DragEvent('dragend',{bubbles:true,dataTransfer:drag.dt}));window.__suppressTouchClickUntil=performance.now()+300}
});
document.addEventListener('pointercancel',()=>{if(pointerDrag?.active)pointerDrag.el.dispatchEvent(new DragEvent('dragend',{bubbles:true,dataTransfer:pointerDrag.dt}));pointerDrag=null});
document.addEventListener('click',event=>{if(performance.now()<(window.__suppressTouchClickUntil||0)){event.preventDefault();event.stopImmediatePropagation()}},true);
// Optional phonetic annotation is separate from the required vertical-bopomofo exercises.
const annotationMap=CONTENT.lesson.zhuyin||{};
const textWalker=document.createTreeWalker($('#track'),NodeFilter.SHOW_TEXT,{acceptNode(n){return n.parentElement.closest('script,style,button,.zhuyin-vertical,.num,.paper-check')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}});
const textNodes=[];while(textWalker.nextNode())textNodes.push(textWalker.currentNode);
for(const node of textNodes){if(![...node.textContent].some(ch=>annotationMap[ch]))continue;const fragment=document.createDocumentFragment();for(const ch of node.textContent){if(annotationMap[ch]){const ruby=document.createElement('ruby');ruby.append(document.createTextNode(ch));const rt=document.createElement('rt');rt.dataset.optionalZhuyin='';rt.textContent=annotationMap[ch];rt.hidden=!ZhuyinManager.enabled;ruby.append(rt);fragment.append(ruby)}else fragment.append(document.createTextNode(ch))}node.replaceWith(fragment)}
$$('.lesson-image').forEach(img=>img.addEventListener('error',()=>{const fallback=document.createElement('div');fallback.className='media-fallback';fallback.textContent=img.alt||'圖片暫時無法載入';img.replaceWith(fallback)}));
const savedProgress=EduBridge.storage.get('progress',null);let startPage=0;
if(savedProgress&&savedProgress.v===1){
 (savedProgress.checks||[]).forEach((states,i)=>{const s=slides[i];if(!s||!Array.isArray(states))return;s.querySelectorAll('.paper-check input,.check-row input').forEach((c,j)=>{if(states[j]===true&&!c.checked){c.checked=true;c.dispatchEvent(new Event('change',{bubbles:true}))}})});
 (savedProgress.done||[]).forEach(i=>{const s=slides[i];if(!Number.isInteger(i)||!s)return;restoredDone.add(i);if(!s.querySelector('[data-confirm-paper],[data-finish-learning]'))return;s.dataset.paperConfirmed='true';const st=s.querySelector('.paper-completion-status');if(st){st.classList.remove('bad');st.classList.add('good');st.textContent=s.classList.contains('final')?UI.completed:'本頁已確認完成！請保留紙本，交給老師閱讀。'}});
 if(Number.isInteger(savedProgress.page))startPage=savedProgress.page;
}
progressReady=true;
showPage(Math.max(0,Math.min(startPage,frontier())),false);
return {pages:pages.length};
}};
